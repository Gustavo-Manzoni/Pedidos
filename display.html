<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#111;color:#fff;overflow:hidden;cursor:default}
.topo{height:11vh;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4.5vh,60px);font-weight:800;letter-spacing:.05em;background:#000}
.cols{display:grid;grid-template-columns:1fr 1fr;height:89vh}
.col{padding:2vh 2vw;overflow:hidden;border-right:4px solid #000}
.col h2{margin:0 0 2vh;text-align:center;font-size:clamp(22px,5vh,64px);padding-bottom:1.5vh;border-bottom:4px solid currentColor}
.proc{background:#1b1b1b;color:#ffa94d}
.pron{background:#0b2a14;color:#69db7c}
.lista{display:flex;flex-wrap:wrap;gap:1.5vh 1.5vw;justify-content:center;align-content:flex-start}
.chip{font-size:clamp(32px,8vh,120px);font-weight:900;line-height:1;padding:.12em .3em;border-radius:.2em;min-width:2.4em;text-align:center}
.proc .chip{background:#2c2c2c;color:#ffd8a8}
.pron .chip{background:#2b8a3e;color:#fff}
.chip.novo{animation:pisca 1s ease-in-out 6}
@keyframes pisca{0%,100%{transform:scale(1);background:#2b8a3e}50%{transform:scale(1.15);background:#f59f00}}
.vazio{opacity:.4;font-size:clamp(18px,4vh,40px);text-align:center;margin-top:6vh}
#semConexao{position:fixed;left:0;right:0;bottom:0;background:#c92a2a;color:#fff;text-align:center;padding:1vh;font-size:clamp(14px,3vh,30px);display:none}
#som{position:fixed;right:10px;bottom:10px;background:#333;color:#ccc;border:0;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;opacity:.5}
#som:hover{opacity:1}
</style>
</head>
<body>
<div class="topo">ACOMPANHE SEU PEDIDO</div>
<div class="cols">
  <div class="col proc"><h2>EM PREPARO</h2><div class="lista" id="proc"></div></div>
  <div class="col pron"><h2>PRONTO</h2><div class="lista" id="pron"></div></div>
</div>
<div id="semConexao">Sem conexão com o servidor. Tentando reconectar...</div>
<button id="som" onclick="ativarSom()">🔔 Ativar som</button>

<script>
var estado = { pedidos: [] };
var prontosAntes = null; // null = ainda não recebeu o primeiro estado
var audio = null;

function $(id) { return document.getElementById(id); }

function ativarSom() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  $('som').textContent = '🔔 Som ativado';
  beep();
}

function beep() {
  if (!audio) return;
  var o = audio.createOscillator(), g = audio.createGain();
  o.connect(g); g.connect(audio.destination);
  o.frequency.value = 880; g.gain.value = 0.2;
  o.start(); o.stop(audio.currentTime + 0.3);
}

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

function render() {
  var ativos = estado.pedidos.slice().sort(function (a, b) { return a.numero - b.numero; });
  var proc = ativos.filter(function (p) { return p.status === 'processando'; });
  var pron = ativos.filter(function (p) { return p.status === 'pronto'; });

  var numerosProntos = pron.map(function (p) { return p.numero; });
  var novos = [];
  if (prontosAntes !== null) {
    novos = numerosProntos.filter(function (n) { return prontosAntes.indexOf(n) === -1; });
  }
  prontosAntes = numerosProntos;

  $('proc').innerHTML = proc.map(function (p) { return '<div class="chip">' + esc(p.nome || p.numero) + '</div>'; }).join('') ||
    '<div class="vazio">Nenhum pedido em preparo</div>';
  $('pron').innerHTML = pron.map(function (p) {
    return '<div class="chip' + (novos.indexOf(p.numero) !== -1 ? ' novo' : '') + '">' + esc(p.nome || p.numero) + '</div>';
  }).join('') || '<div class="vazio">Nenhum pedido pronto</div>';

  if (novos.length) beep();
}

function conectar() {
  var es = new EventSource('/eventos');
  es.onopen = function () { $('semConexao').style.display = 'none'; };
  es.onmessage = function (e) { estado = JSON.parse(e.data); render(); };
  es.onerror = function () { $('semConexao').style.display = 'block'; };
}

conectar();
/* um pedido leve a cada 4 min evita que o servidor gratuito da nuvem "durma" */
setInterval(function () { fetch('/saude').catch(function () {}); }, 240000);
</script>
</body>
</html>
