<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Caixa</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#222;--muted:#777;--accent:#e8590c;--ok:#2b8a3e;--blue:#1c7ed6;--danger:#c92a2a;--line:#e3ddd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:#fff;background:#555}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}

header{display:flex;align-items:center;gap:8px;background:#2b2b2b;padding:8px 10px;height:var(--hh,60px)}
.aba{flex:1;max-width:220px;height:44px;background:#444;font-size:18px;font-weight:600}
.aba.ativa{background:var(--accent)}
.aba .n{background:#fff;color:#222;border-radius:20px;padding:1px 9px;margin-left:6px;font-size:15px}
#conexao{margin-left:auto;color:#fff;font-size:14px;display:flex;align-items:center;gap:6px}
#ponto{width:12px;height:12px;border-radius:50%;background:#e03131}
#ponto.on{background:#40c057}

.tela{display:none;height:calc(100% - var(--hh,60px))}
.tela.ativa{display:block}

/* ---- caixa ---- */
.aba svg{display:none}
body.tc{--hh:76px;background:#0e0e0f;color:#f2f2f2}
body.tc header{background:#0e0e0f;padding:0 28px;gap:10px;border-bottom:1px solid #1b1b1d}
body.tc .aba{flex:none;max-width:none;height:100%;background:transparent;color:#b5b5b8;border-radius:0;font-size:19px;font-weight:600;
  display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:3px solid transparent;margin-top:3px}
body.tc .aba svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
body.tc .aba.ativa{color:#fff;border-bottom-color:#ff8a2a}
body.tc .aba.ativa svg{stroke:#ff8a2a}
body.tc .aba .n{background:#2a2a2d;color:#e5e5e7;font-size:14px;padding:3px 10px;margin-left:0}
body.tc #conexao{color:#e5e5e7}
#tela-caixa.ativa{display:grid;grid-template-columns:1fr 440px;gap:20px;padding:20px 28px 24px}
#tela-caixa .pprod{position:relative;background:#141415;border:1px solid #232326;border-radius:20px;padding:22px 24px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ptopo{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;position:relative;z-index:1}
.ptopo h2{margin:0;font-size:30px;font-weight:700;border-left:4px solid #ff8a2a;padding-left:14px;line-height:1.1}
.busca{display:flex;align-items:center;gap:10px;background:#1d1d1f;border-radius:12px;padding:0 16px;height:52px;width:280px;color:#9a9a9f}
.busca svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.busca input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f2f2f2;font-size:16px}
.busca input::placeholder{color:#8a8a8f}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start;overflow:auto;position:relative;z-index:1}
.prod{background:#1c1c1e;color:#f2f2f2;border:1px solid #262628;border-radius:16px;min-height:120px;padding:16px;text-align:left;
  font-size:21px;font-weight:600;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:12px}
.prod .nm{line-height:1.2}
.prod .pf{display:flex;align-items:center;justify-content:space-between}
.prod small{font-size:20px;color:#ff8a2a;font-weight:700}
.prod .mais{width:34px;height:34px;border-radius:9px;background:#2d2d30;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;color:#fff}
.prod:active .mais{background:#ff8a2a}
.painel{background:#141415;border-radius:20px;border:1px solid #232326;display:flex;flex-direction:column;overflow:hidden;min-height:0;color:#f2f2f2}
.ptit{display:flex;align-items:center;gap:16px;margin:22px 24px 0;padding-bottom:16px;border-bottom:1px solid #242427}
.ptit svg{width:40px;height:40px;fill:none;stroke:#ff8a2a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ptit h2{margin:0;font-size:28px;font-weight:700}
#bannerEdicao{display:none;background:#3a2a12;color:#ffc078;margin:12px 24px 0;border-radius:12px;padding:8px 12px;align-items:center;justify-content:space-between;font-weight:700}
#bannerEdicao button{background:#3a3a3e;padding:8px 12px}
#linhas{flex:1;overflow:auto;padding:8px 24px;min-height:80px}
.vazio{color:var(--muted);text-align:center;padding:24px 8px;font-size:18px}
#linhas .vazio{color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:36px;font-size:16px}
#linhas .vazio svg{width:90px;height:90px;fill:none;stroke:#6b6b70;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
#linhas .vazio b{color:#c8c8cc;font-size:19px;font-weight:600}
.menu .vazio{grid-column:1/-1;color:#8e8e93}
.linha{border-bottom:1px solid #242427;padding:10px 0}
.l1{display:flex;justify-content:space-between;font-size:20px}
.l2{display:flex;align-items:center;gap:8px;margin-top:6px}
.qb{width:46px;height:46px;font-size:26px;font-weight:700;background:#2d2d30}
.q{min-width:34px;text-align:center;font-size:22px;font-weight:700}
.un{color:#8e8e93;font-size:15px}
.obsb{margin-left:auto;background:#2d2d30;color:#e5e5e7;height:46px;padding:0 12px;font-size:16px}
.obsi{margin-top:4px;color:#ff9fc2;font-size:16px}
.rodape{padding:0 24px 24px;border-top:1px solid #242427}
.obsl{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:15px;color:#d0d0d4;font-weight:600}
.obsl svg{width:22px;height:22px;fill:none;stroke:#b5b5b8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.obsl span{font-weight:400;color:#8e8e93}
#obsPedido{width:100%;height:84px;border:0;border-radius:12px;padding:12px 14px;font-size:16px;resize:none;background:#1d1d1f;color:#f2f2f2;outline:0}
#obsPedido::placeholder{color:#7d7d82}
.tot{display:flex;justify-content:space-between;align-items:center;margin:18px 0 16px;padding-top:16px;border-top:1px solid #242427}
.tot span{font-size:22px;font-weight:600}
#total{font-size:38px;font-weight:800;color:#2fbf71}
.fila{display:flex;gap:12px}
#btnConfirmar{flex:1;height:64px;font-size:20px;font-weight:700;background:#ff8a2a;color:#1a1208;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px}
#btnConfirmar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#btnLimpar{height:64px;padding:0 28px;font-size:18px;font-weight:600;background:#222225;color:#d6d6da;border-radius:14px;display:flex;align-items:center;gap:10px}
#btnLimpar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}


/* ---- juice ---- */
.prod{transition:transform .12s,border-color .15s}
.prod:hover{border-color:#4a3118}
.prod:active{transform:scale(.93)}
.prod .mais{transition:transform .18s,background .15s}
.prod:active .mais{transform:rotate(90deg) scale(1.25)}
.linha.novo{animation:entra .3s cubic-bezier(.2,1.5,.4,1)}
.linha.novo .q{display:inline-block;animation:pulo .35s}
@keyframes entra{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulo{40%{transform:scale(1.7);color:#ff8a2a}}
#total{display:inline-block;transform-origin:right center}
#total.bump{animation:bump .38s}
@keyframes bump{30%{transform:scale(1.28);text-shadow:0 0 20px rgba(47,191,113,.75)}}
#btnConfirmar:not(:disabled){animation:brilho 2.2s ease-in-out infinite}
@keyframes brilho{0%,100%{box-shadow:0 0 0 0 rgba(255,138,42,0)}50%{box-shadow:0 0 24px 2px rgba(255,138,42,.45)}}
#aviso.pop{animation:avisoPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes avisoPop{from{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.7)}to{opacity:1;transform:translateX(-50%)}}
.fx{position:fixed;pointer-events:none;z-index:50;left:0;top:0;font-weight:800;will-change:transform,opacity}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- pedidos ---- */
#tela-pedidos.ativa{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 28px 24px}
.col{background:#141415;border:1px solid #232326;border-radius:20px;padding:22px 24px;overflow:auto}
.col h2{margin:0 0 18px;font-size:28px;font-weight:700;padding-left:14px;line-height:1.1;border-left:4px solid #ff8a2a}
.col.proc h2{color:#f2f2f2;border-left-color:#ff8a2a}
.col.pron h2{color:#f2f2f2;border-left-color:#2fbf71}
.col .vazio{color:#8e8e93}
.card{background:#1c1c1e;border:1px solid #262628;border-radius:16px;padding:16px;margin-bottom:12px;border-left:5px solid #ff8a2a}
.col.pron .card{border-left-color:#2fbf71}
.cab{display:flex;justify-content:space-between;align-items:baseline}
.num{font-size:30px;font-weight:800}
.hora{color:#8e8e93}
.card ul{margin:8px 0;padding-left:20px;font-size:19px}
.card li em{color:#ff9fc2;font-style:normal}
.obsp{background:#3a2a12;color:#ffc078;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:17px}
.valor{font-size:22px;font-weight:800;margin:8px 0;color:#2fbf71}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.b{height:52px;padding:0 16px;font-size:17px;font-weight:700;background:#2d2d30;color:#e5e5e7;border-radius:12px}
.b.ok{background:#2fbf71;color:#08210f;flex:1}
.b.entrega{background:#ff8a2a;color:#1a1208;flex:1}
.b.ruim{background:#3a1f22;color:#ff7b7b}

/* ---- cardapio ---- */
#tela-cardapio.ativa{display:block;overflow:auto;padding:20px 28px 24px}
.caixaed{max-width:760px;margin:0 auto}
.bloco{background:#141415;border-radius:20px;padding:22px 24px;margin-bottom:16px;border:1px solid #232326}
.bloco h2{margin:0 0 12px;font-size:24px;font-weight:700;padding-left:14px;line-height:1.1;border-left:4px solid #ff8a2a}
.ed{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.ed input{height:52px;border:0;border-radius:12px;padding:0 14px;font-size:19px;min-width:0;background:#1d1d1f;color:#f2f2f2;outline:0}
.ed input:focus{box-shadow:0 0 0 2px #ff8a2a}
.ed input::placeholder{color:#7d7d82}
.ed .edn{flex:1}.ed .edp{width:120px;text-align:right}
.ed .pre{font-size:19px;color:#8e8e93}
.dica{color:#8e8e93;font-size:15px;margin:0 0 12px}
.resumo{font-size:19px;line-height:1.7}
.resumo b{color:#2fbf71}
.bloco .vazio{color:#8e8e93}

#aviso{position:fixed;left:50%;top:92px;transform:translateX(-50%);background:#1c1c1e;border:1px solid #2fbf71;color:#fff;padding:16px 26px;border-radius:16px;
  font-size:26px;font-weight:800;box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 24px rgba(47,191,113,.25);display:none;z-index:10;text-align:center;white-space:pre-line}

@media (max-width:820px){
  #tela-caixa.ativa{grid-template-columns:1fr;overflow:auto;height:auto;padding:12px}
  .busca{width:170px}
  body.tc .aba span.t{display:none}
  #tela-pedidos.ativa{grid-template-columns:1fr;overflow:auto;height:auto}
}
</style>
</head>
<body class="tc">
<header>
  <button class="aba ativa" id="aba-caixa" onclick="abrirTela('caixa')"><svg viewBox="0 0 24 24"><path d="M4 11a8 6 0 0 1 16 0z"/><path d="M3 14h18"/><path d="M5 17h14a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/></svg><span class="t">Caixa</span></button>
  <button class="aba" id="aba-pedidos" onclick="abrirTela('pedidos')"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12h7M9 16h7"/></svg><span class="t">Pedidos</span><span class="n" id="contador">0</span></button>
  <button class="aba" id="aba-cardapio" onclick="abrirTela('cardapio')"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h1M8 12h1M8 15h1M12 9h4M12 12h4M12 15h4"/></svg><span class="t">Cardápio</span></button>
  <div id="conexao"><span id="ponto"></span><span id="txtConexao">conectando...</span></div>
</header>

<div id="aviso"></div>

<!-- CAIXA -->
<section class="tela ativa" id="tela-caixa">
  <div class="pprod">
    <div class="ptopo"><h2>Produtos</h2><label class="busca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="busca" placeholder="Buscar produto..." oninput="renderMenu()" autocomplete="off"></label></div>
    <div class="menu" id="menu"></div>
  </div>
  <div class="painel">
    <div class="ptit"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h10.3L20 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><h2>Pedido atual</h2></div>
    <div id="bannerEdicao"><span id="txtEdicao"></span><button onclick="cancelarEdicao()">Cancelar edição</button></div>
    <div id="linhas"></div>
    <div class="rodape">
      <div class="obsl"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Observação do pedido <span>(ex: tudo sem sal)</span></div>
      <textarea id="obsPedido" placeholder="Digite aqui..."></textarea>
      <div class="tot"><span>Total a pagar</span><div id="total">R$ 0,00</div></div>
      <div class="fila">
        <button id="btnLimpar" onclick="limparCarrinho(true)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Limpar</button>
        <button id="btnConfirmar" onclick="confirmar()">Confirmar pedido</button>
      </div>
    </div>
  </div>
</section>

<!-- PEDIDOS -->
<section class="tela" id="tela-pedidos">
  <div class="col proc"><h2>Processando (<span id="nProc">0</span>)</h2><div id="colProc"></div></div>
  <div class="col pron"><h2>Pronto (<span id="nPron">0</span>)</h2><div id="colPron"></div></div>
</section>

<!-- CARDÁPIO -->
<section class="tela" id="tela-cardapio">
  <div class="caixaed">
    <div class="bloco">
      <h2>Produtos e preços</h2>
      <p class="dica">Mudou aqui, muda em todos os caixas. Pedidos já feitos mantêm o preço da hora em que foram feitos.</p>
      <div id="listaEd"></div>
    </div>
    <div class="bloco">
      <h2>Adicionar produto</h2>
      <div class="ed">
        <input class="edn" id="novoNome" placeholder="Nome do produto">
        <span class="pre">R$</span>
        <input class="edp" id="novoPreco" inputmode="decimal" placeholder="0,00">
        <button class="b ok" style="flex:none" onclick="adicionarProduto()">+ Adicionar</button>
      </div>
    </div>
    <div class="bloco">
      <h2>Resumo</h2>
      <div class="resumo" id="resumo"></div>
      <button class="b ruim" style="margin-top:10px" onclick="reiniciarDia()">Novo dia: apagar todos os pedidos</button>
    </div>
  </div>
</section>

<script>
var estado = { cardapio: [], pedidos: [] };
var carrinho = [];   // {nome, preco, qtd, obs}
var editando = null; // número do pedido em edição
var PIN = '';        // senha do caixa (guardada neste aparelho)
try { PIN = localStorage.getItem('pin') || ''; } catch (e) {}
var perguntouRestaurar = false;

function $(id) { return document.getElementById(id); }
function brl(v) { return 'R$ ' + (Math.round(v * 100) / 100).toFixed(2).replace('.', ','); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function somaItens(itens) {
  return Math.round(itens.reduce(function (a, i) { return a + i.preco * i.qtd; }, 0) * 100) / 100;
}

/* ---------- comunicação ---------- */
function api(metodo, url, corpo) {
  return fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', 'x-pin': PIN },
    body: corpo !== undefined ? JSON.stringify(corpo) : undefined
  }).then(function (r) {
    if (r.status === 401) {
      try { localStorage.removeItem('pin'); } catch (e) {}
      alert('Senha incorreta ou alterada. A página vai recarregar.');
      location.reload();
    }
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error(d.erro || ('Erro ' + r.status));
      return d;
    });
  });
}

/* guarda uma cópia dos dados neste aparelho; se o servidor na nuvem reiniciar vazio, dá para restaurar */
function guardarBackup() {
  if (!(estado.mudancas > 0)) return;
  try {
    localStorage.setItem('backup', JSON.stringify({
      cardapio: estado.cardapio, pedidos: estado.pedidos, proximoPedido: estado.proximoPedido
    }));
  } catch (e) {}
}

function verificarBackup() {
  var b = null;
  try { b = JSON.parse(localStorage.getItem('backup') || 'null'); } catch (e) {}
  if (!b || !b.pedidos || !b.cardapio) return;
  if (confirm('O servidor reiniciou e perdeu os dados. Restaurar os pedidos e o cardápio guardados neste aparelho?')) {
    api('POST', '/api/restaurar', { cardapio: b.cardapio, pedidos: b.pedidos, proximoPedido: b.proximoPedido })
      .then(atualizarAgora)
      .catch(function (e) { alert(e.message); });
  } else {
    try { localStorage.removeItem('backup'); } catch (e) {}
  }
}

function receber(d) {
  if (!d || d.publico) return;
  estado = d;
  renderTudo();
  guardarBackup();
  if (estado.mudancas === 0) {
    if (!perguntouRestaurar) { perguntouRestaurar = true; verificarBackup(); }
  } else {
    perguntouRestaurar = false;
  }
}

function atualizarAgora() {
  return fetch('/api/estado', { headers: { 'x-pin': PIN } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(receber)
    .catch(function () {});
}

function setOnline(on) {
  $('ponto').className = on ? 'on' : '';
  $('txtConexao').textContent = on ? 'conectado' : 'sem conexão';
}

function conectar() {
  var es = new EventSource('/eventos?pin=' + encodeURIComponent(PIN));
  es.onopen = function () { setOnline(true); };
  es.onmessage = function (e) { receber(JSON.parse(e.data)); };
  es.onerror = function () { setOnline(false); };
}

/* ---------- abas ---------- */
function abrirTela(nome) {
  ['caixa', 'pedidos', 'cardapio'].forEach(function (t) {
    $('tela-' + t).classList.toggle('ativa', t === nome);
    $('aba-' + t).classList.toggle('ativa', t === nome);
  });
  if (nome === 'cardapio') { renderEditor(); renderResumo(); }
}

var timerAviso = null;
function aviso(txt) {
  var el = $('aviso');
  el.textContent = txt; el.style.display = 'block';
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  clearTimeout(timerAviso);
  timerAviso = setTimeout(function () { el.style.display = 'none'; }, 5000);
}

/* ---------- caixa ---------- */
function renderMenu() {
  var q = ($('busca').value || '').trim().toLowerCase();
  var lista = estado.cardapio.filter(function (p) { return !q || p.nome.toLowerCase().indexOf(q) >= 0; });
  $('menu').innerHTML = lista.map(function (p) {
    return '<button class="prod" onclick="addProduto(' + p.id + ',event)"><span class="nm">' + esc(p.nome) + '</span><span class="pf"><small>' + brl(p.preco) + '</small><span class="mais">+</span></span></button>';
  }).join('') || '<div class="vazio">' + (estado.cardapio.length ? 'Nenhum produto encontrado.' : 'Cardápio vazio. Cadastre na aba Cardápio.') + '</div>';
}

var ultimoIdx = -1, totalAnt = 0;
var reduzMov = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* partículas: voam do ponto (x,y) e somem */
function estouro(x, y, n, cores, dist) {
  if (reduzMov) return;
  for (var k = 0; k < n; k++) {
    var d = document.createElement('div');
    var tam = 6 + Math.random() * 6;
    d.className = 'fx';
    d.style.cssText = 'width:' + tam + 'px;height:' + tam + 'px;border-radius:' + (Math.random() < .5 ? '50%' : '2px') +
      ';background:' + cores[k % cores.length];
    document.body.appendChild(d);
    var a = Math.random() * Math.PI * 2, r = dist * (.5 + Math.random() * .7);
    var dx = Math.cos(a) * r, dy = Math.sin(a) * r - dist * .4;
    var an = d.animate([
      { transform: 'translate(' + x + 'px,' + y + 'px) rotate(0)', opacity: 1 },
      { transform: 'translate(' + (x + dx) + 'px,' + (y + dy + 40) + 'px) rotate(' + (Math.random() * 540 - 270) + 'deg)', opacity: 0 }
    ], { duration: 550 + Math.random() * 350, easing: 'cubic-bezier(.1,.7,.3,1)' });
    an.onfinish = (function (el) { return function () { el.remove(); }; })(d);
  }
}

/* texto que sobe e some (ex: +1) */
function flutua(x, y, txt, cor) {
  if (reduzMov) return;
  var d = document.createElement('div');
  d.className = 'fx';
  d.textContent = txt;
  d.style.cssText = 'font-size:26px;color:' + cor + ';text-shadow:0 2px 8px rgba(0,0,0,.6)';
  document.body.appendChild(d);
  var an = d.animate([
    { transform: 'translate(' + (x - 12) + 'px,' + y + 'px) scale(.6)', opacity: 0 },
    { transform: 'translate(' + (x - 12) + 'px,' + (y - 30) + 'px) scale(1.2)', opacity: 1, offset: .25 },
    { transform: 'translate(' + (x - 12) + 'px,' + (y - 80) + 'px) scale(1)', opacity: 0 }
  ], { duration: 750, easing: 'ease-out' });
  an.onfinish = function () { d.remove(); };
}

function centro(el) {
  var r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function addProduto(id, ev) {
  var p = estado.cardapio.find(function (x) { return x.id === id; });
  if (!p) return;
  var ex = carrinho.find(function (i) { return i.nome === p.nome && i.preco === p.preco && !i.obs; });
  if (ex) { if (ex.qtd < 99) ex.qtd++; } else carrinho.push({ nome: p.nome, preco: p.preco, qtd: 1, obs: '' });
  ultimoIdx = carrinho.indexOf(ex || carrinho[carrinho.length - 1]);
  renderCarrinho();
  if (ev && ev.currentTarget) {
    var c = centro(ev.currentTarget);
    estouro(c.x, c.y, 8, ['#ff8a2a', '#ffb066', '#ffd9b0'], 70);
    flutua(c.x, c.y - 10, '+1', '#ff8a2a');
  }
}

function mudarQtd(idx, d) {
  var i = carrinho[idx]; if (!i) return;
  i.qtd += d;
  if (i.qtd <= 0) carrinho.splice(idx, 1);
  else if (i.qtd > 99) i.qtd = 99;
  renderCarrinho();
}

function obsItem(idx) {
  var i = carrinho[idx]; if (!i) return;
  var v = prompt('Observação para ' + i.nome + ' (ex: sem sal):', i.obs || '');
  if (v === null) return;
  i.obs = v.trim().slice(0, 80);
  renderCarrinho();
}

function renderCarrinho() {
  var el = $('linhas');
  if (!carrinho.length) {
    el.innerHTML = '<div class="vazio"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><b>Nenhum item no pedido</b><span>Adicione produtos ao pedido<br>para começar.</span></div>';
  } else {
    el.innerHTML = carrinho.map(function (i, idx) {
      return '<div class="linha' + (idx === ultimoIdx ? ' novo' : '') + '"><div class="l1"><b>' + esc(i.nome) + '</b><span>' + brl(i.preco * i.qtd) + '</span></div>' +
        '<div class="l2"><button class="qb" onclick="mudarQtd(' + idx + ',-1)">−</button>' +
        '<span class="q">' + i.qtd + '</span>' +
        '<button class="qb" onclick="mudarQtd(' + idx + ',1)">+</button>' +
        '<span class="un">' + brl(i.preco) + ' un.</span>' +
        '<button class="obsb" onclick="obsItem(' + idx + ')">✎ obs</button></div>' +
        (i.obs ? '<div class="obsi">📝 ' + esc(i.obs) + '</div>' : '') + '</div>';
    }).join('');
  }
  ultimoIdx = -1;
  var tt = somaItens(carrinho);
  $('total').textContent = brl(tt);
  if (tt !== totalAnt && tt > 0) {
    $('total').classList.remove('bump'); void $('total').offsetWidth; $('total').classList.add('bump');
  }
  totalAnt = tt;
  $('btnConfirmar').innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>' + (editando ? 'Salvar alterações #' + editando : 'Confirmar pedido');
  $('btnConfirmar').disabled = !carrinho.length;
  $('bannerEdicao').style.display = editando ? 'flex' : 'none';
  if (editando) $('txtEdicao').textContent = 'Editando pedido #' + editando;
}

function limparCarrinho(perguntar) {
  if (perguntar && (carrinho.length || $('obsPedido').value) && !confirm('Limpar o pedido atual?')) return;
  carrinho = []; editando = null; $('obsPedido').value = '';
  renderCarrinho();
}

function cancelarEdicao() { limparCarrinho(false); }

function confirmar() {
  if (!carrinho.length) return;
  var corpo = {
    itens: carrinho.map(function (i) { return { nome: i.nome, preco: i.preco, qtd: i.qtd, obs: i.obs }; }),
    obs: $('obsPedido').value
  };
  var total = somaItens(carrinho);
  var req = editando
    ? api('PUT', '/api/pedidos/' + editando, corpo).then(function (p) { aviso('Pedido #' + p.numero + ' atualizado\nTotal ' + brl(total)); })
    : api('POST', '/api/pedidos', corpo).then(function (p) { aviso('Pedido #' + p.numero + ' criado\nTotal ' + brl(total)); });
  req.then(function () {
       var c = centro($('btnConfirmar'));
       estouro(c.x, c.y, 36, ['#ff8a2a', '#2fbf71', '#ffd43b', '#4dabf7', '#f783ac'], 190);
       limparCarrinho(false); atualizarAgora();
     })
     .catch(function (e) { alert(e.message); atualizarAgora(); });
}

/* ---------- pedidos ---------- */
function cartao(p) {
  var hora = new Date(p.criadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  var itens = p.itens.map(function (i) {
    return '<li><b>' + i.qtd + 'x</b> ' + esc(i.nome) + (i.obs ? ' <em>(' + esc(i.obs) + ')</em>' : '') + '</li>';
  }).join('');
  var botoes = p.status === 'processando'
    ? '<button class="b ok" onclick="mudarStatus(' + p.numero + ',\'pronto\')">✔ Pronto</button>' +
      '<button class="b" onclick="editar(' + p.numero + ')">✎ Editar</button>' +
      '<button class="b ruim" onclick="excluir(' + p.numero + ')">🗑</button>'
    : '<button class="b entrega" onclick="mudarStatus(' + p.numero + ',\'entregue\')">📦 Entregue</button>' +
      '<button class="b" onclick="mudarStatus(' + p.numero + ',\'processando\')">↩ Voltar</button>' +
      '<button class="b" onclick="editar(' + p.numero + ')">✎</button>' +
      '<button class="b ruim" onclick="excluir(' + p.numero + ')">🗑</button>';
  return '<div class="card"><div class="cab"><span class="num">#' + p.numero + '</span><span class="hora">' + hora + '</span></div>' +
    '<ul>' + itens + '</ul>' +
    (p.obs ? '<div class="obsp">📝 ' + esc(p.obs) + '</div>' : '') +
    '<div class="valor">' + brl(somaItens(p.itens)) + '</div>' +
    '<div class="acoes">' + botoes + '</div></div>';
}

function renderPedidos() {
  var ativos = estado.pedidos.filter(function (p) { return p.status !== 'entregue'; })
    .sort(function (a, b) { return a.numero - b.numero; });
  var proc = ativos.filter(function (p) { return p.status === 'processando'; });
  var pron = ativos.filter(function (p) { return p.status === 'pronto'; });
  $('colProc').innerHTML = proc.map(cartao).join('') || '<div class="vazio">Nenhum pedido</div>';
  $('colPron').innerHTML = pron.map(cartao).join('') || '<div class="vazio">Nenhum pedido</div>';
  $('nProc').textContent = proc.length;
  $('nPron').textContent = pron.length;
  $('contador').textContent = ativos.length;
}

function mudarStatus(n, st) {
  api('POST', '/api/pedidos/' + n + '/status', { status: st })
    .then(atualizarAgora)
    .catch(function (e) { alert(e.message); atualizarAgora(); });
}

function excluir(n) {
  if (!confirm('Excluir o pedido #' + n + '?')) return;
  api('DELETE', '/api/pedidos/' + n)
    .then(function () { if (editando === n) limparCarrinho(false); atualizarAgora(); })
    .catch(function (e) { alert(e.message); atualizarAgora(); });
}

function editar(n) {
  var p = estado.pedidos.find(function (x) { return x.numero === n; });
  if (!p) return;
  carrinho = p.itens.map(function (i) { return { nome: i.nome, preco: i.preco, qtd: i.qtd, obs: i.obs || '' }; });
  $('obsPedido').value = p.obs || '';
  editando = n;
  renderCarrinho();
  abrirTela('caixa');
}

/* ---------- cardápio ---------- */
function renderEditor() {
  $('listaEd').innerHTML = estado.cardapio.map(function (p) {
    return '<div class="ed"><input class="edn" value="' + esc(p.nome) + '" onchange="salvarProduto(' + p.id + ',this.parentNode)">' +
      '<span class="pre">R$</span>' +
      '<input class="edp" inputmode="decimal" value="' + p.preco.toFixed(2).replace('.', ',') + '" onchange="salvarProduto(' + p.id + ',this.parentNode)">' +
      '<button class="b ruim" onclick="removerProduto(' + p.id + ')">🗑</button></div>';
  }).join('') || '<div class="vazio">Nenhum produto</div>';
}

function lerPreco(txt) { return parseFloat(String(txt).replace(',', '.')); }

function enviarCardapio(lista) {
  return api('PUT', '/api/cardapio', lista).then(atualizarAgora).catch(function (e) { alert(e.message); renderEditor(); });
}

function salvarProduto(id, linha) {
  var nome = linha.querySelector('.edn').value.trim();
  var preco = lerPreco(linha.querySelector('.edp').value);
  if (!nome || !isFinite(preco) || preco < 0) { alert('Nome ou preço inválido'); renderEditor(); return; }
  enviarCardapio(estado.cardapio.map(function (p) { return p.id === id ? { id: id, nome: nome, preco: preco } : p; }));
}

function removerProduto(id) {
  var p = estado.cardapio.find(function (x) { return x.id === id; });
  if (!p || !confirm('Remover "' + p.nome + '" do cardápio?')) return;
  enviarCardapio(estado.cardapio.filter(function (x) { return x.id !== id; }));
}

function adicionarProduto() {
  var nome = $('novoNome').value.trim();
  var preco = lerPreco($('novoPreco').value);
  if (!nome || !isFinite(preco) || preco < 0) { alert('Preencha o nome e o preço (ex: 3,50)'); return; }
  enviarCardapio(estado.cardapio.concat([{ id: null, nome: nome, preco: preco }])).then(function () {
    $('novoNome').value = ''; $('novoPreco').value = '';
  });
}

function renderResumo() {
  var todos = estado.pedidos;
  var entregues = todos.filter(function (p) { return p.status === 'entregue'; }).length;
  var total = todos.reduce(function (a, p) { return a + somaItens(p.itens); }, 0);
  $('resumo').innerHTML = 'Pedidos feitos: <b>' + todos.length + '</b> (entregues: ' + entregues + ')<br>' +
    'Total em pedidos: <b>' + brl(total) + '</b>';
}

function reiniciarDia() {
  if (!confirm('Apagar TODOS os pedidos e voltar a numeração para 100?')) return;
  if (!confirm('Tem certeza? Isso não pode ser desfeito.')) return;
  api('POST', '/api/reiniciar', {}).then(function () { limparCarrinho(false); atualizarAgora(); })
    .catch(function (e) { alert(e.message); });
}

/* ---------- geral ---------- */
function renderTudo() {
  renderMenu();
  renderPedidos();
  renderResumo();
  var ativo = document.activeElement;
  var editandoCardapio = ativo && ativo.tagName === 'INPUT' && ativo.closest('#tela-cardapio');
  if (!editandoCardapio) renderEditor();
}

/* abre o caixa: pede a senha se o servidor exigir */
function iniciar() {
  fetch('/api/estado', { headers: { 'x-pin': PIN } }).then(function (r) {
    if (r.status === 401) {
      var v = prompt('Digite a senha do caixa:');
      if (v === null) {
        document.body.innerHTML = '<p style="padding:30px;font-size:22px">Senha necessária. Recarregue a página.</p>';
        return;
      }
      PIN = v.trim();
      try { localStorage.setItem('pin', PIN); } catch (e) {}
      return iniciar();
    }
    if (r.status === 429) {
      document.body.innerHTML = '<p style="padding:30px;font-size:22px">Muitas tentativas erradas. Espere 5 minutos e recarregue.</p>';
      return;
    }
    return r.json().then(function (d) { receber(d); conectar(); });
  }).catch(function () { setTimeout(iniciar, 3000); });
}

renderCarrinho();
iniciar();
/* um pedido leve a cada 4 min evita que o servidor gratuito da nuvem "durma" */
setInterval(function () { fetch('/saude').catch(function () {}); }, 240000);
</script>
</body>
